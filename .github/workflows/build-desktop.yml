name: build-desktop

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'packages/desktop/**'
      - '.github/workflows/build-desktop.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Build CLI (all platforms)
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: dev
          OPENCODE_RELEASE: ""
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

      - name: Upload Windows CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cli-windows
          path: packages/opencode/dist/opencode-windows-*

  build-tauri-windows:
    name: Tauri Windows (${{ matrix.target }})
    needs: build-cli
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: ${{ matrix.target }}

      - name: Download Windows CLI artifacts
        uses: actions/download-artifact@v4
        with:
          name: opencode-cli-windows
          path: packages/opencode/dist

      - name: Prepare environment
        env:
          OPENCODE_VERSION: dev
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_CLI_ARTIFACT: opencode-cli-windows
          RUST_TARGET: ${{ matrix.target }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          cd packages/desktop
          bun ./scripts/prepare.ts

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@390cbe447412ced1303d35abe75287949e43437a   # 固定 SHA，与原项目一致
        timeout-minutes: 30
        with:
          projectPath: packages/desktop
          uploadWorkflowArtifacts: true
          args: --target ${{ matrix.target }} --config ./src-tauri/tauri.prod.conf.json --verbose
          tauriScript: cargo tauri
        env:
          GITHUB_TOKEN: ${{ github.token }}
