name: build-desktop

on:
  workflow_dispatch:                      # 允许手动触发
  push:
    branches:
      - dev
    paths:
      - 'packages/desktop/**'
      - '.github/workflows/build-desktop.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true               # 改为 false，避免取消旧作业（可按需调整）

permissions:
  contents: read

jobs:
  # 构建 CLI（所有平台，重点生成 Windows 二进制）
  build-cli:
    runs-on: ubuntu-latest                # 使用 GitHub 官方 runner，避免等待 Blacksmith
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Build CLI (all platforms)
        run: |
          ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: dev
          OPENCODE_RELEASE: ""
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

      - name: Upload Windows CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cli-windows
          path: packages/opencode/dist/opencode-windows-*

  # 构建 Tauri 桌面端（Windows）
  build-tauri-windows:
    name: Tauri Windows (${{ matrix.target }})
    needs: build-cli                      # 等待 CLI 构建完成
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-2025          # GitHub 官方 Windows 2025 runner 支持 ARM64（通过仿真）
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: ${{ matrix.target }}

      - name: Download Windows CLI artifacts
        uses: actions/download-artifact@v4
        with:
          name: opencode-cli-windows
          path: packages/opencode/dist

      - name: Prepare environment
        env:
          OPENCODE_VERSION: dev
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_CLI_ARTIFACT: opencode-cli-windows
          RUST_TARGET: ${{ matrix.target }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          cd packages/desktop
          bun ./scripts/prepare.ts

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        timeout-minutes: 30
        with:
          projectPath: packages/desktop
          args: --target ${{ matrix.target }} --config ./src-tauri/tauri.prod.conf.json
          tauriScript: cargo tauri
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-${{ matrix.target }}
          path: |
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/*.exe
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/*.msi
          if-no-files-found: error
