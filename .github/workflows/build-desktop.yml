name: build-desktop

on:
  workflow_dispatch:                     # 允许手动触发
  push:
    branches:
      - dev                              # dev 分支推送时自动构建
    paths:
      - 'packages/desktop/**'            # 仅当桌面端相关文件变更时触发
      - '.github/workflows/build-desktop.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-tauri-windows:
    name: Tauri Windows (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
        include:
          - target: x86_64-pc-windows-msvc
            runner: blacksmith-4vcpu-windows-2025   # 或 windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-2025                    # ARM64 需要 GitHub 官方 runner 或支持 ARM 的 runner
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: ${{ matrix.target }}

      - name: Prepare environment (download CLI artifact)
        env:
          OPENCODE_VERSION: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_CLI_ARTIFACT: opencode-cli-windows
          RUST_TARGET: ${{ matrix.target }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          cd packages/desktop
          bun ./scripts/prepare.ts

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        timeout-minutes: 30
        with:
          projectPath: packages/desktop
          args: --target ${{ matrix.target }} --config ./src-tauri/tauri.prod.conf.json
          tauriScript: cargo tauri
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-${{ matrix.target }}
          path: |
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/*.exe
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/*.msi
          if-no-files-found: error
